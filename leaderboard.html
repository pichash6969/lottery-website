<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="clock" id="clock">00:00:00</div>
        <div class="user-info">
            <img id="profileImg" src="https://via.placeholder.com/35" alt="Profile">
            <span id="username">Guest</span>
            <span id="balance">0 🪙</span>
            <span id="vipBadge" class="vip-badge">VIP1</span>
        </div>
    </header>

    <div class="main-container">
        <h2>Leaderboard</h2>
        <div class="leaderboard" id="leaderboardContainer">
            <h3>Top Users</h3>
        </div>
    </div>

    <script src="user.js"></script>
    <script>
        function updateLeaderboard() {
            let allUsers = JSON.parse(localStorage.getItem('users')) || {};
            const container = document.getElementById('leaderboardContainer');
            container.innerHTML = '<h3>Top Users</h3>';
            Object.values(allUsers).sort((a, b) => b.balance - a.balance).forEach(user => {
                const div = document.createElement('div');
                div.textContent = `${user.username} - ${user.balance} 🪙 - ${user.vipLevel}`;
                container.appendChild(div);
            });
        }
        setInterval(updateLeaderboard, 2000);
        updateLeaderboard();
    </script>
</body>

</html>
