<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery System - Balance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="betting.html">Betting</a>
            <a href="balance.html">Balance</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="login.html" id="loginLink">Login</a>
        </div>
    </nav>

    <!-- Balance Page -->
    <div class="balance-page">
        <div style="text-align: center;">
            <img src="https://via.placeholder.com/100" alt="Profile" class="profile-image" id="balanceProfileImage" style="width: 100px; height: 100px; margin-bottom: 1rem;">
            <h2 id="balanceUsername">Username</h2>
            <h3>Balance: <span id="balanceAmount">0</span> Coins</h3>
            <span class="vip-badge vip1" id="balanceVipBadge">VIP1</span>
        </div>
        
        <div class="redeem-form">
            <input type="text" id="redeemCode" placeholder="Enter redeem code">
            <button class="btn" onclick="redeemCode()">Redeem</button>
        </div>

        <div style="margin-top: 2rem; background: rgba(255,255,255,0.1); padding: 1rem; border-radius: 10px;">
            <h4>Available Redeem Codes:</h4>
            <ul style="list-style: none; padding: 0;">
                <li>💰 WELCOME100 - 100 Coins</li>
                <li>🍀 LUCKY50 - 50 Coins</li>
                <li>👑 VIP200 - 200 Coins</li>
                <li>🎁 BONUS75 - 75 Coins</li>
                <li>⭐ GOLD300 - 300 Coins</li>
            </ul>
        </div>
    </div>

    <script src="user.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            updateBalancePage();
        });
    </script>
</body>
</html>
