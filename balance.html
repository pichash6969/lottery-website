<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="clock" id="clock">00:00:00</div>
        <div class="user-info">
            <img id="profileImg" src="https://via.placeholder.com/35" alt="Profile">
            <span id="username">Guest</span>
            <span id="balance">0 🪙</span>
            <span id="vipBadge" class="vip-badge">VIP1</span>
        </div>
    </header>

    <div class="main-container">
        <h2>Your Balance</h2>
        <div id="balanceDetails">
            <p>Total Coins: <span id="balanceCoins">0</span> 🪙</p>
        </div>

        <h3>Redeem Code</h3>
        <input type="text" id="redeemCode" placeholder="Enter code">
        <button onclick="redeemCode(document.getElementById('redeemCode').value)">Redeem</button>
    </div>

    <script src="user.js"></script>
    <script src="script.js"></script>
</body>

</html>
